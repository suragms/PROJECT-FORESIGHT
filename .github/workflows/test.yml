name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile src/config.py src/forecasting/inference.py src/api/app.py src/monitoring/run_monitoring.py src/validate_phase12.py src/validate_phase13.py src/validate_phase14.py src/validate_phase15.py src/security/auth.py src/production/readiness.py src/production/simulation.py src/production/docker_check.py src/bi/exports.py src/bi/kpis.py dashboard/executive_intelligence.py
      - name: Unit / API / inference tests
        run: python -m pytest tests -q
        continue-on-error: true
      - name: Registry and freeze notes
        run: python -c "from src.forecasting.registry import load_registry, verify_hash; r=load_registry(); [verify_hash(x) for x in r]; print('registry_ok', len(r))"
        continue-on-error: true

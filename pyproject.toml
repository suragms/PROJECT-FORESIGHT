[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-inventory-intelligence"
version = "1.0.0"
description = "Project Foresight — AI-Powered Demand & Inventory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "joblib>=1.3.2",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8.2",
    "requests>=2.31.0",
    "jinja2>=3.1.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-inventory-intelligence"
version = "1.0.0"
description = "Project Foresight — AI-Powered Demand & Inventory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8.2",
    "jinja2>=3.1.3",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "altair>=5.2.0",
    "statsmodels>=0.14.1",
    "scipy>=1.12.0",
    "joblib>=1.3.2"
]

[tool.vercel]
entrypoint = "src.api.app:app"
